<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none';">
    <title>WAYMARK</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div id="app" class="app-shell">
        <aside class="sidebar">
            <div class="brand"><div class="brand-mark logo-mark"><img src="assets/waymark-icon.png" alt="" aria-hidden="true"></div><div class="brand-name">WAYMARK</div></div>
            <nav class="primary-nav" aria-label="Primary">
                <button class="nav-item active" data-route="home"><span class="nav-icon">⌂</span><span>Home</span></button>
                <button class="nav-item" data-route="watch"><span class="nav-icon">▶</span><span>Watch</span></button>
                <button class="nav-item" data-route="review"><span class="nav-icon">✎</span><span>Review</span></button>
                <button class="nav-item" data-route="library"><span class="nav-icon">▣</span><span>Library</span></button>
                <button class="nav-item" data-route="history"><span class="nav-icon">◷</span><span>History</span></button>
                <button class="nav-item" data-route="search"><span class="nav-icon">⌕</span><span>Search</span></button>
            </nav>
            <div class="sidebar-bottom">
                <button class="nav-item" data-route="settings"><span class="nav-icon">⚙</span><span>Settings</span></button>
                <div class="ready-status"><span class="status-dot"></span> WAYMARK ready</div>
            </div>
        </aside>
        <main class="main-area">
            <header class="topbar"><div id="page-label">Home</div><div class="profile"><div class="profile-mark">S</div><span>Shubham</span><span class="profile-chevron">⌄</span></div></header>
            <section id="view" class="view" aria-live="polite"></section>
        </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="js/app.js"></script>
</body>
</html>

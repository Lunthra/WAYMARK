<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none';">
    <title>WAYMARK</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div id="app" class="app-shell">
        <aside class="sidebar">
            <div class="brand" title="WAYMARK"><div class="brand-mark logo-mark"><img src="assets/waymark-icon.png" alt="WAYMARK"></div><div class="brand-name">WAYMARK</div></div>
            <nav class="primary-nav" aria-label="Primary navigation">
                <button class="nav-item active" data-route="home" data-tooltip="Home" aria-label="Home"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span><span>Home</span></button>
                <button class="nav-item" data-route="watch" data-tooltip="Watch" aria-label="Watch"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M8 5.5v13l10-6.5-10-6.5Z" fill="currentColor"/></svg></span><span>Watch</span></button>
                <button class="nav-item" data-route="review" data-tooltip="Review" aria-label="Review"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="m14.7 5.2 4.1 4.1M6 18l1.1-4.2L15.9 5a1.8 1.8 0 0 1 2.6 0l.5.5a1.8 1.8 0 0 1 0 2.6l-8.8 8.8L6 18Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>Review</span></button>
                <button class="nav-item" data-route="library" data-tooltip="Library" aria-label="Library"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="5" y="4" width="14" height="16" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M9 4v16M12 8h4M12 12h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span><span>Library</span></button>
                <button class="nav-item" data-route="history" data-tooltip="History" aria-label="History"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="7.5" stroke="currentColor" stroke-width="1.7"/><path d="M12 8v4l2.8 1.7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.8 7.4 4 4.8l2.7.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>History</span></button>
                <button class="nav-item" data-route="search" data-tooltip="Search" aria-label="Search"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="10.8" cy="10.8" r="5.8" stroke="currentColor" stroke-width="1.7"/><path d="m15.2 15.2 4.2 4.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span><span>Search</span></button>
            </nav>
            <div class="sidebar-bottom">
                <button class="nav-item" data-route="settings" data-tooltip="Settings" aria-label="Settings"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M9.4 4.9 10 3h4l.6 1.9 1.7 1 .9-.4 2.8 2.8-.4.9 1 1.7 1.9.6v4l-1.9.6-1 1.7.4.9-2.8 2.8-.9-.4-1.7 1L14 21h-4l-.6-1.9-1.7-1-.9.4L4 15.7l.4-.9-1-1.7-1.9-.6v-4l1.9-.6 1-1.7-.4-.9 2.8-2.8.9.4 1.7-1Z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg></span><span>Settings</span></button>
                <div class="ready-status" title="WAYMARK ready"><span class="status-dot"></span><span>WAYMARK ready</span></div>
            </div>
        </aside>
        <main class="main-area">
            <header class="topbar"><div id="page-label">Home</div><div class="profile"><div class="profile-mark">S</div><span>Shubham</span><span class="profile-chevron">⌄</span></div></header>
            <section id="view" class="view" aria-live="polite"></section>
        </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="js/app.js"></script>
</body>
</html>
